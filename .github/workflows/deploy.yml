name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: ${{ vars.DOMAIN }}
      INDEXING: ${{ vars.INDEXING }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/render-wrangler.mjs
      - name: D1 migrations (before any code that needs them)
        working-directory: apps/mcp
        run: pnpm exec wrangler d1 migrations apply seerah --remote
      - name: Deploy MCP
        working-directory: apps/mcp
        run: pnpm exec wrangler deploy -c wrangler.deploy.jsonc
      - name: Deploy web
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare build && pnpm exec opennextjs-cloudflare deploy -c wrangler.deploy.jsonc
      - name: Deploy backup cron
        working-directory: apps/backup
        run: pnpm exec wrangler deploy
